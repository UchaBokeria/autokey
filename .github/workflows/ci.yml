name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: CGO_ENABLED=0 go vet ./...
      - name: build static
        run: CGO_ENABLED=0 go build -o autokey .
      - name: test
        run: go test ./internal/kripi/ ./internal/mail/ ./internal/pool/ ./internal/flow/
